name: Build artefak (deploy manual)

# Deploy dari GitHub tidak dimungkinkan: FTPS diblokir firewall Rumahweb, SSH tertutup, dan menu API Token cPanel tidak tersedia.
# Deploy dilakukan manual lewat cPanel File Manager (zip dipecah; lihat docs/PANDUAN-UPDATE-KODE-DAN-DEPLOY.md). Workflow ini hanya membuat artefak dist.zip. Lihat docs/CICD.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx astro check
      - run: npm test
      - run: npm run build
      - name: Pastikan build memuat .htaccess dan beranda
        run: test -f dist/.htaccess && test -f dist/index.html
      - name: Buat dist.zip (termasuk berkas tersembunyi)
        run: cd dist && zip -qr ../dist.zip . && ls -lh ../dist.zip
      - uses: actions/upload-artifact@v4
        with: { name: dist-zip, path: dist.zip, retention-days: 30 }
