name: Deploy (staging → Rumahweb via cPanel API)

# FTPS gagal (port data pasif diblokir firewall Rumahweb; SFTP/SSH tertutup), jadi unggahan memakai cPanel UAPI lewat HTTPS 2083:
# zip dist/ → upload ke public_html → ekstrak → hapus zip. EKSPERIMENTAL: belum diuji di server Rumahweb. Lihat docs/CICD.md.
# Secret yang dibutuhkan: CPANEL_HOST, CPANEL_USER, CPANEL_TOKEN. Tanpa secret, job deploy dilewati dan hanya artefak dist.zip yang dihasilkan.
on:
  push:
    branches: [staging]
  workflow_dispatch:   # tombol "Run workflow" hanya muncul bila berkas ini ada di branch default (main)

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_URL: https://malangeducationcenter.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx astro check
      - run: npm test
      - run: npm run build
      - name: Pastikan build memuat .htaccess dan beranda
        run: test -f dist/.htaccess && test -f dist/index.html
      - name: Buat dist.zip (termasuk berkas tersembunyi)
        run: cd dist && zip -qr ../dist.zip . && ls -lh ../dist.zip
      - uses: actions/upload-artifact@v4
        with: { name: dist-zip, path: dist.zip, retention-days: 30 }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production   # opsional: "Required reviewers" di Settings > Environments agar tiap deploy perlu persetujuan
    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - name: Cek secret
        id: gate
        run: |
          if [ -z "$CPANEL_HOST" ] || [ -z "$CPANEL_USER" ] || [ -z "$CPANEL_TOKEN" ]; then
            echo "Secret cPanel belum lengkap: deploy dilewati. Unduh artefak dist-zip dan unggah manual (docs/CICD.md)." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with: { name: dist-zip }
      - name: Cek koneksi dan token cPanel (gagal cepat bila port 2083/token bermasalah)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          out=$(curl -sS --max-time 60 -H "$AUTH" "https://${CPANEL_HOST}:2083/execute/Fileman/list_files?dir=public_html&limit_to_list=1") || { echo "::error::cPanel tidak terjangkau di port 2083 dari runner GitHub. Pakai artefak dist-zip + unggah manual."; exit 1; }
          echo "$out" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('status')==1 else (print(d.get('errors')) or 1))"
      - name: Unggah dist.zip ke public_html
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          curl -sS --max-time 600 -H "$AUTH" -F "dir=/home/${CPANEL_USER}/public_html" -F "overwrite=1" -F "file-1=@dist.zip;filename=_deploy-dist.zip" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/upload_files" | tee /tmp/up.json
          python3 -c "import json; d=json.load(open('/tmp/up.json')); raise SystemExit(0 if d.get('status')==1 else 1)"
      - name: Ekstrak di server, lalu hapus zip
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          base="https://${CPANEL_HOST}:2083/json-api/cpanel?cpanel_jsonapi_apiversion=2&cpanel_jsonapi_module=Fileman&cpanel_jsonapi_func=fileop&doubledecode=0"
          curl -sS --max-time 300 -H "$AUTH" "${base}&op=extract&sourcefiles=/home/${CPANEL_USER}/public_html/_deploy-dist.zip&destfiles=/home/${CPANEL_USER}/public_html" | tee /tmp/ex.json
          python3 -c "import json; d=json.load(open('/tmp/ex.json')); r=d['cpanelresult']; raise SystemExit(0 if not r.get('error') and r['data'][0].get('result',1) else 1)"
          curl -sS --max-time 60 -H "$AUTH" "${base}&op=unlink&sourcefiles=/home/${CPANEL_USER}/public_html/_deploy-dist.zip&destfiles=" >/dev/null
      - name: Uji asap setelah deploy (situs hidup)
        if: steps.gate.outputs.run == 'true'
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/home.html -w '%{http_code}' "$SITE_URL/") && [ "$code" = 200 ] && grep -q "MEC Academy" /tmp/home.html && break
            echo "percobaan $i gagal (HTTP $code), ulangi..."; sleep 10
          done
          [ "$code" = 200 ] && grep -q "MEC Academy" /tmp/home.html
          r=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$SITE_URL/organisasi/"); echo "redirect lama: $r"
          echo "$r" | grep -q '^301 '
          z=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/_deploy-dist.zip"); echo "zip sisa: $z"; [ "$z" = 404 ]
